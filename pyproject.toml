# Workspace root. Not a deployable package: it only ties the members together
# under a single uv.lock and holds local tooling / sandbox dependencies.
[project]
name = "agent-monorepo"
version = "0.1.0"
description = "Mono repo of LangGraph agents deployed to AWS Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "agents/*"]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
]
# Extra libraries used only by the standalone scripts in sandbox/
sandbox = [
    "boto3>=1.42.16",
    "deepagents>=0.6.7",
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-aws>=1.5.0",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.2",
    "mcp>=1.28.0",
    "pydantic>=2.12.5",
    "strands-agents>=1.20.0",
    "uvicorn[standard]>=0.40.0",
]

[tool.uv]
# `uv sync` at the root installs both groups for local work.
# Docker builds opt out with --no-default-groups.
default-groups = ["dev", "sandbox"]
