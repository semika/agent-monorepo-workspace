[project]
name = "mail-drafter"
version = "0.1.0"
description = "Multi-agent email drafter (gatherer -> drafter -> reviewer) on Bedrock AgentCore"
requires-python = ">=3.13"
dependencies = [
    "agent-shared",
    "boto3>=1.42.16",
    "botocore",
    "fastapi>=0.127.0",
    "langchain>=1.3.2",
    "langchain-aws>=1.5.0",
    "langgraph>=1.2.2",
    "pydantic>=2.12.5",
    "strands-agents>=1.20.0",
    "uvicorn[standard]>=0.40.0",
]

[tool.uv.sources]
agent-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_drafter"]
