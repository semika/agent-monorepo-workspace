[project]
name = "agent-shared"
version = "0.1.0"
description = "Code shared across agents: base settings, DynamoDB-backed LangGraph store"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.16",
    "langgraph>=1.2.2",
    "pydantic-settings>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_shared"]
